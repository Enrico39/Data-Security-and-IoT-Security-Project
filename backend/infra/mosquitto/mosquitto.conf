# Configurazione di sviluppo del broker MQTT (Mosquitto 2.1).
# Canale in chiaro, raggiungibile solo da localhost (vedi docker-compose.yml).
# TLS 1.3 con autenticazione reciproca (mTLS) sarà aggiunto in una fase successiva.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
